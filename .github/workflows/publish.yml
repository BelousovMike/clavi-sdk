name: publish

# Tag a release: git tag v0.1.0-preview.4 && git push origin v0.1.0-preview.4
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0-preview.4)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm/PyPI trusted publishing when configured

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: .NET test
        run: dotnet test Clavi.Sdk.sln -c Release
        env:
          CLAVI_SDK_SMOKE: "0"
      - name: JS test
        working-directory: js
        run: npm install && npm test
        env:
          CLAVI_SDK_SMOKE: "0"
      - name: Java test
        working-directory: java
        run: mvn -B -q test
        env:
          CLAVI_SDK_SMOKE: "0"
      - name: Python test
        working-directory: python
        run: pip install -e ".[dev]" && pytest -q
        env:
          CLAVI_SDK_SMOKE: "0"
      - name: Go test
        working-directory: go
        run: go test ./...
        env:
          CLAVI_SDK_SMOKE: "0"

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing version $V"

  nuget:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          dotnet pack Clavi.Sdk.sln -c Release -o ./artifacts -p:Version="$VERSION" -p:PackageVersion="$VERSION"
          ls -la ./artifacts
      - name: Push nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is not set" >&2
            exit 1
          fi
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  npm:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Set version + install
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ../scripts/set-version.sh "$VERSION"
          npm install
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not set" >&2
            exit 1
          fi
          TAG=latest
          case "${{ needs.resolve-version.outputs.version }}" in
            *-preview*|*-rc*|*b*|*a*) TAG=preview ;;
          esac
          npm publish -w @clavi/sdk-core --access public --tag "$TAG"
          npm publish -w @clavi/admin-client --access public --tag "$TAG"

  pypi:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          ../scripts/set-version.sh "${{ needs.resolve-version.outputs.version }}"
          pip install build
          python -m build
      - name: Upload PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "PYPI_API_TOKEN secret is not set" >&2
            exit 1
          fi
          pip install twine
          twine upload dist/*

  maven:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    # Requires Sonatype Central + GPG secrets; skip quietly if missing.
    if: ${{ vars.PUBLISH_MAVEN == 'true' }}
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ../scripts/set-version.sh "$VERSION"
      - name: Deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -DskipTests deploy

  go-module:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Remind proxy.golang.org
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "Go modules are fetched from the git tag."
          echo "After the tag is on GitHub, consumers use:"
          echo "  go get github.com/BelousovMike/clavi-sdk/go/clavi@v${VERSION}"
          echo "Force proxy refresh (optional):"
          echo "  curl https://proxy.golang.org/github.com/BelousovMike/clavi-sdk/go/clavi/@v/v${VERSION}.info"
