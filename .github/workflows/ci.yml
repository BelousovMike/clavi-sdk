name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build Clavi.Sdk.sln -c Release
      - name: Test
        run: dotnet test Clavi.Sdk.sln -c Release --no-build
        env:
          CLAVI_SDK_SMOKE: "0"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Test
        run: npm test
        env:
          CLAVI_SDK_SMOKE: "0"

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn -B -q test
        env:
          CLAVI_SDK_SMOKE: "0"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
        env:
          CLAVI_SDK_SMOKE: "0"

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
        env:
          CLAVI_SDK_SMOKE: "0"

  pack-dry-run:
    runs-on: ubuntu-latest
    needs: [dotnet, js, java, python, go]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack (no upload)
        run: |
          dotnet pack Clavi.Sdk.sln -c Release -o ./artifacts
          (cd js && npm install \
            && npm pack -w @clavi/sdk-core \
            && npm pack -w @clavi/admin-client \
            && npm pack -w @clavi/oidc \
            && npm pack -w @clavi/express \
            && npm pack -w @clavi/nestjs \
            && npm pack -w @clavi/next)
          (cd java && mvn -B -q package -DskipTests)
          pip install build
          for dir in python python-oidc python-fastapi python-django; do
            (cd "$dir" && python -m build)
          done
          ls -la artifacts js/*.tgz java/*/target/*.jar python/dist python-oidc/dist || true
